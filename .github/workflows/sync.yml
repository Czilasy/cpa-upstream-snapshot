name: mirror-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: clone codeberg and push to this repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rem="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          git clone --mirror https://codeberg.org/mingjiu/cpa-multi-plugins.git repo.git
          cd repo.git

          echo "--- 上游分支"
          git for-each-ref --format='%(refname)' refs/heads | head -20
          echo "--- 上游 tag 数"
          git tag | wc -l
          echo "--- 上游 HEAD"
          git log -1 --format='%H %ci %s' refs/heads/main

          # 上游默认分支推成 mirror；其余分支推成 mirror-<名字>
          git push --force "$rem" refs/heads/main:refs/heads/mirror
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads | grep -v '^main$'); do
            git push --force "$rem" "refs/heads/$b:refs/heads/mirror-$(echo "$b" | tr '/' '-')"
          done

          # 标签全量同步
          git push --force --tags "$rem"

          echo "MIRROR_DONE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
